<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Galeria - FieldProof</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#17322B" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/c/gallery.css" />
</head>
<body>
  <div class="topbar" id="topbar">
    <img id="logo" class="logo" src="/icons/icon-192.png" alt="" />
    <div>
      <h1 id="companyName">Galeria</h1>
      <div class="top-sub">Evidencia fotografica</div>
    </div>
  </div>

  <div class="gallery-container">

    <!-- Login por codigo -->
    <div id="loginView" class="card login-card">
      <div class="login-icon">
        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7"/></svg>
      </div>
      <h2>Ingresar a la galeria</h2>
      <p class="hint">Usa el codigo de tu sitio, o el PIN de administrador para ver todos los sitios.</p>
      <label for="accessCode">Codigo de acceso</label>
      <input type="text" id="accessCode" placeholder="Escribe tu codigo" autocomplete="off" />
      <div class="error-msg" id="loginError"></div>
      <button class="btn btn-primary" id="btnLogin" style="margin-top:6px">Entrar</button>
    </div>

    <!-- Galeria -->
    <div id="galleryView" style="display:none">
      <div class="filters card">
        <select id="filterSite" style="display:none"></select>
        <input type="date" id="filterFrom" title="Desde" />
        <input type="date" id="filterTo" title="Hasta" />
        <select id="filterJobType">
          <option value="">Todos los trabajos</option>
          <option value="Rutina">Rutina</option>
          <option value="Proyecto">Proyecto</option>
        </select>
        <input type="text" id="filterSearch" placeholder="Buscar sitio, nombre, direccion..." />
      </div>

      <div class="toolbar">
        <span class="count-badge" id="countBadge">0 archivos</span>
        <div class="spacer"></div>
        <button class="btn btn-secondary icon-btn" id="btnSelectAll" title="Seleccionar todo">
          <svg class="icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M6.5 10l2.2 2.2L14 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="label">Seleccionar todo</span>
        </button>
        <button class="btn btn-secondary icon-btn" id="btnDownloadZip" title="Descargar ZIP">
          <svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M10 3v9m0 0l-3.2-3.2M10 12l3.2-3.2M4 14.5v1A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5v-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="label">Descargar ZIP</span>
        </button>
        <button class="btn btn-secondary icon-btn" id="btnPdf" title="Reporte PDF">
          <svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M6 2.5h5.5L15 6v10.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M11 2.5V6h4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span class="label">Reporte PDF</span>
        </button>
        <button class="btn btn-secondary icon-btn" id="btnXlsx" title="Excel de cobertura">
          <svg class="icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="1.6" stroke="currentColor" stroke-width="1.5"/><path d="M3 8h14M8 3v14" stroke="currentColor" stroke-width="1.4"/></svg>
          <span class="label">Excel cobertura</span>
        </button>
        <button class="btn btn-danger icon-btn" id="btnDeleteSelected" style="display:none" title="Eliminar seleccionados">
          <svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M4 6h12M8 6V4.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V6m-7 0 .7 9.3a1.5 1.5 0 0 0 1.5 1.4h4.6a1.5 1.5 0 0 0 1.5-1.4L14.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="label">Eliminar</span>
        </button>
      </div>

      <div class="media-grid" id="mediaGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none">
        <svg viewBox="0 0 40 40" fill="none" style="margin-bottom:10px"><rect x="6" y="9" width="28" height="22" rx="3" stroke="currentColor" stroke-width="1.6"/><circle cx="15" cy="17" r="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M9 27l7-6 5 4.5 6-6.5 6 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>No hay fotos ni videos con estos filtros.</div>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M9 6V4.5a1.5 1.5 0 0 1 1.5-1.5h3a1.5 1.5 0 0 1 1.5 1.5V6m-9 0 .9 12.4A2 2 0 0 0 9.4 20h5.2a2 2 0 0 0 2-1.6L18.5 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h3>Eliminar permanentemente</h3>
      <p id="confirmText">Esta accion no se puede deshacer.</p>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btnCancelDelete">Cancelar</button>
        <button class="btn btn-danger" id="btnConfirmDelete">Si, eliminar</button>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox-overlay" style="display:none">
    <button class="lightbox-close" id="btnCloseLightbox">
      <svg viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="lightboxContent"></div>
  </div>

  <script src="/c/gallery.js"></script>
</body>
</html>
