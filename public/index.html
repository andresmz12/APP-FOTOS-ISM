<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FieldProof — camara con ubicacion y fecha</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#17322B" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/camera.css" />
</head>
<body>
  <div class="topbar">
    <img class="logo" src="/icons/icon-192.png" alt="" />
    <div>
      <h1>FieldProof</h1>
      <div class="top-sub">Camara con ubicacion y fecha</div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h2>Toma una foto</h2>
      <p class="hint">
        Cada foto queda con la ubicacion exacta y la fecha/hora quemadas,
        como una camara con timestamp GPS. Gratis, sin cuenta ni registro:
        las fotos se guardan directo en tu telefono.
      </p>

      <div class="geo-banner geo-loading" id="geoBanner">
        <svg class="icon spin" viewBox="0 0 20 20" fill="none"><path d="M17 10a7 7 0 1 1-2.05-4.95" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Obteniendo tu ubicacion...</span>
      </div>

      <div class="photo-actions">
        <button class="btn btn-primary" id="btnTakePhoto" disabled>
          <svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M3 7a1.5 1.5 0 0 1 1.5-1.5h1.44a1 1 0 0 0 .86-.5l.6-1a1 1 0 0 1 .86-.5h2.48a1 1 0 0 1 .86.5l.6 1a1 1 0 0 0 .86.5h1.44A1.5 1.5 0 0 1 17 7v7.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="10" cy="10.5" r="2.7" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>Tomar foto</span>
        </button>
      </div>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden />

      <div class="thumb-grid" id="thumbGrid"></div>
    </div>
  </div>

  <div class="ad-banner hidden" id="adBanner">
    <span>Espacio publicitario</span>
    <a href="#" id="adRemoveLink">Quitar anuncios</a>
  </div>

  <script src="/camera.js"></script>
</body>
</html>
